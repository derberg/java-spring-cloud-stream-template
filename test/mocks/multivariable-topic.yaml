asyncapi: 2.3.0
info:
  title: ExpenseReportingIntegrationApplication
  version: 0.0.1
  description: Testing multivariable topics
  contact:
    name: API Support
    email: support@example.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
defaultContentType: application/json
servers:
  production:
    url: https://api.example.com
    protocol: https
    description: Production server
tags:
  - name: billing
    description: Billing related operations
components:
  schemas:
    RideReceipt:
      $schema: 'http://json-schema.org/draft-07/schema#'
      type: object
      title: This schema is irrelevant
      $id: 'http://example.com/root.json'
  messages:
    BillingReceiptCreated:
      payload:
        $ref: '#/components/schemas/RideReceipt'
      schemaFormat: application/vnd.aai.asyncapi+json;version=2.0.0
      contentType: application/json
channels:
  'acme/billing/receipts/{receipt_id}/created/{version}/regions/{region}/chargify/{ride_id}':
    subscribe:
      operationId: receiveBillingReceipt
      bindings:
        solace:
          bindingVersion: 0.1.0
          destinations:
            - destinationType: topic
      message:
        payload:
          $ref: '#/components/schemas/RideReceipt'
        schemaFormat: application/vnd.aai.asyncapi+json;version=2.0.0
        contentType: application/json
    parameters:
      version:
        schema:
          type: string
      receipt_id:
        schema:
          type: string
      ride_id:
        schema:
          type: string
      region:
        schema:
          type: string
          enum:
            - US
            - UK
            - CA
            - MX
